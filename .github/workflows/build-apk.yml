name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-armv7:
    name: Build CuteShare ARMv7 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare environment & signing keystore
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -alias androiddebugkey \
                -keypass android \
                -storepass android \
                -dname "CN=Android Debug,O=Android,C=US" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000
            fi
          fi
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          chmod +x gradlew

      - name: Build ARMv7 APK (armeabi-v7a)
        run: ./gradlew assembleDebug -PtargetAbi=armeabi-v7a --stacktrace

      - name: Organize ARMv7 Artifact
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/CuteShare-armeabi-v7a.apk
          ls -la build-artifacts/

      - name: Upload CuteShare ARMv7 APK
        uses: actions/upload-artifact@v4
        with:
          name: CuteShare-ARMv7-APK
          path: build-artifacts/CuteShare-armeabi-v7a.apk
          if-no-files-found: error
          retention-days: 30

  build-armv8:
    name: Build CuteShare ARMv8 APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare environment & signing keystore
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -alias androiddebugkey \
                -keypass android \
                -storepass android \
                -dname "CN=Android Debug,O=Android,C=US" \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000
            fi
          fi
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          chmod +x gradlew

      - name: Build ARMv8 APK (arm64-v8a)
        run: ./gradlew assembleDebug -PtargetAbi=arm64-v8a --stacktrace

      - name: Organize ARMv8 Artifact
        run: |
          mkdir -p build-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk build-artifacts/CuteShare-arm64-v8a.apk
          ls -la build-artifacts/

      - name: Upload CuteShare ARMv8 APK
        uses: actions/upload-artifact@v4
        with:
          name: CuteShare-ARMv8-APK
          path: build-artifacts/CuteShare-arm64-v8a.apk
          if-no-files-found: error
          retention-days: 30
